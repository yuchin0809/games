<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ふたごミルの脱出部屋｜2匹を切り替えて協力する無料ブラウザ脱出ゲーム</title>
<meta name="description" content="ミルとミミを切り替えて、ボタンを押す役ととびらを通る役に分かれて脱出。毎日変わる部屋に挑戦。自分で部屋を作って友達に出題もできる無料ブラウザゲーム。">
<meta property="og:title" content="ふたごミルの脱出部屋">
<meta property="og:description" content="2匹を切り替えて協力して脱出！自分の部屋を作って友達に出題もできる。">
<style>
  :root{--bg:#1f1a2e;--panel:#2c2540;--ink:#f6efe3;--sub:#b7aac9;--acc:#ffb84d;--ok:#4ecb8d;--ng:#ff6b6b;--pk:#ff9ec7}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.5}
  .scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:12px 12px 8px;overflow-y:auto}
  .hide{display:none!important}
  h1{font-size:1.25rem;text-align:center;margin-top:4px}
  .card{background:var(--panel);border-radius:18px;padding:16px;margin-top:12px;width:100%;max-width:440px}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:1.02rem;font-weight:700;background:var(--acc);color:#2a1d00;cursor:pointer;margin-top:10px;font-family:inherit}
  .btn:active{transform:translateY(2px)}
  .btn.sub{background:#3e3558;color:var(--ink);font-weight:500;font-size:.92rem;padding:10px}
  .btn.pk{background:var(--pk);color:#3a0d22}
  .pen{color:var(--sub);font-size:.8rem}
  .twins{display:block;margin:2px auto 0}
  #game{padding:6px 0 0;justify-content:flex-start;overflow:hidden;touch-action:none}
  .hud{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
  #timer{font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  #timer.low{color:var(--ng)}
  #who{font-size:.9rem;font-weight:700}
  #rst{border:0;border-radius:10px;background:#3e3558;color:var(--ink);font-size:.75rem;padding:6px 10px;font-family:inherit}
  .stage{position:relative;margin-top:4px}
  canvas.cv{display:block;border-radius:12px;background:#000;touch-action:none}
  .ctrl{position:relative;width:100%;max-width:440px;flex:1;min-height:120px;touch-action:none}
  #stick{position:absolute;right:14px;bottom:10px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);touch-action:none}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,184,77,.9);box-shadow:0 2px 8px rgba(0,0,0,.5)}
  #swap{position:absolute;left:16px;bottom:22px;width:92px;height:92px;border-radius:50%;border:3px solid #fff;background:#7fe3c4;color:#10382d;font-size:.9rem;font-weight:800;font-family:inherit;touch-action:none;line-height:1.2}
  #swap.mimi{background:#ffb3d1;color:#4a1230}
  #hlp{display:none;position:absolute;left:14px;right:150px;top:6px;font-size:.72rem;color:var(--sub)}
  @media (hover:hover) and (pointer:fine){#hlp{display:block}}
  .share{white-space:pre-wrap;background:#241d38;border-radius:12px;padding:12px;margin-top:12px;font-size:.88rem;-webkit-user-select:text;user-select:text;word-break:break-all}
  .small{font-size:.78rem;color:var(--sub);text-align:center;margin:14px 0 8px}
  .small a{color:var(--acc)}
  .res h2{font-size:1.5rem;text-align:center}
  #pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:440px;margin-top:8px}
  #pal button{border:2px solid #4a4068;border-radius:10px;background:#2c2540;color:var(--ink);font-size:.7rem;padding:6px 2px;font-family:inherit;line-height:1.2}
  #pal button.on{border-color:var(--acc);background:#4a3d6e}
  #pal i{display:block;width:16px;height:16px;border-radius:4px;margin:0 auto 2px}
  .erow{display:flex;gap:6px;width:100%;max-width:440px}
  .erow .btn{margin-top:8px;padding:9px 4px;font-size:.82rem}
  #emsg{font-size:.85rem;margin-top:6px;min-height:1.3em;text-align:center;max-width:440px}
</style>
</head>
<body>

<div id="start" class="scr">
  <h1>🔐 ふたごミルの脱出部屋</h1>
  <p class="pen" id="date" style="text-align:center"></p>
  <div class="card">
    <canvas id="tw" class="twins" width="260" height="90" style="width:260px;height:90px"></canvas>
    <p style="text-align:center;margin-top:6px"><b>ミル</b>と<b>ミミ</b>が、知らない部屋に閉じ込められた！</p>
    <p style="margin-top:10px;color:var(--sub);font-size:.88rem">2匹を<b>いれかえ</b>ボタンで切り替えて操作しよう。片方が<b>ボタン</b>の上に立つと、同じ色の<b>とびら</b>が開く。ふたりとも自分の<b>ゴール</b>に着いたら脱出成功。<br>制限時間は4分。</p>
    <p id="best" class="pen" style="margin-top:8px"></p>
    <p id="rname" style="text-align:center;margin-top:8px;font-weight:700"></p>
    <button class="btn" id="go">はじめる</button>
    <button class="btn pk" id="mk">🛠 じぶんの部屋をつくる</button>
  </div>
  <p class="small"><a href="../">ゆううのゲームひろば</a> ／ 今日の部屋は毎日0時（日本時間）に変わります</p>
</div>

<div id="game" class="scr hide">
  <div class="hud"><div id="timer">4:00</div><div id="who"></div><button id="rst">やりなおし</button></div>
  <div class="stage"><canvas id="cv" class="cv"></canvas></div>
  <div class="ctrl">
    <div id="hlp">矢印／WASDで移動・スペースでいれかえ・Rでやりなおし</div>
    <button id="swap">いれかえ</button>
    <div id="stick"><div id="knob"></div></div>
  </div>
</div>

<div id="edit" class="scr hide">
  <h1>🛠 じぶんの部屋をつくる</h1>
  <div class="stage" style="margin-top:6px"><canvas id="ec" class="cv"></canvas></div>
  <div id="pal"></div>
  <div class="erow">
    <button class="btn sub" id="echeck">クリアできるかチェック</button>
    <button class="btn sub" id="eclear">からっぽにする</button>
    <button class="btn sub" id="eback">もどる</button>
  </div>
  <div id="emsg"></div>
  <div id="eshare" class="card hide">
    <p class="pen">この部屋のURL（友達に送ろう）</p>
    <div class="share" id="eurl"></div>
    <button class="btn" id="etweet">Xで出題する</button>
    <button class="btn sub" id="ecopy">URLをコピー</button>
    <button class="btn sub" id="eplay">自分であそんでみる</button>
  </div>
</div>

<div id="result" class="scr hide">
  <div class="card res">
    <h2 id="rtitle"></h2>
    <div class="share" id="share"></div>
    <button class="btn" id="tweet">Xでシェアする</button>
    <button class="btn sub" id="copy">コピーする</button>
    <button class="btn pk" id="mk2">🛠 じぶんの部屋をつくって出題する</button>
    <button class="btn sub" id="again">もう一度挑戦する</button>
  </div>
  <p class="small"><a href="../">ゆううのゲームひろば</a></p>
</div>

<script>
var W=10,H=13,N=W*H;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var BIT={a:1,b:2,c:4,A:1,B:2,C:4};
// 最短手数(1手=どちらかが1マス動く)。free=常に開いているとびらのビット、path=経路も返す
function solve(L,free,wantPath){
  var g=L.g,pl=new Uint8Array(N),dr=new Uint8Array(N),wl=new Uint8Array(N);
  for(var i=0;i<N;i++){var ch=g[i];if(ch==="#")wl[i]=1;else if(ch>="a"&&ch<="c")pl[i]=BIT[ch];else if(ch>="A"&&ch<="C")dr[i]=BIT[ch]}
  var dist=new Int16Array(N*N).fill(-1),prev=wantPath?new Int32Array(N*N).fill(-1):null,q=new Int32Array(N*N),qh=0,qt=0;
  var s0=L.M*N+L.N;dist[s0]=0;q[qt++]=s0;var goal=-1;
  var DX=[1,-1,0,0],DY=[0,0,1,-1];
  while(qh<qt){
    var s=q[qh++],pm=(s/N)|0,pn=s%N;
    if(g[pm]==="m"&&g[pn]==="n"){goal=s;break}
    var open=pl[pm]|pl[pn]|(free||0);
    for(var w=0;w<2;w++){
      var p=w?pn:pm,px=p%W,py=(p/W)|0;
      for(var d=0;d<4;d++){
        var nx=px+DX[d],ny=py+DY[d];if(nx<0||ny<0||nx>=W||ny>=H)continue;
        var t=ny*W+nx;if(wl[t])continue;if(dr[t]&&!(open&dr[t]))continue;
        var ns=w?pm*N+t:t*N+pn;
        if(dist[ns]<0){dist[ns]=dist[s]+1;if(prev)prev[ns]=s;q[qt++]=ns}
      }
    }
  }
  if(goal<0)return wantPath?{d:-1}:-1;
  if(!wantPath)return dist[goal];
  var path=[],c=goal;while(c!==s0){path.push(c);c=prev[c]}path.reverse();return{d:dist[goal],path:path};
}
var THEMES=["書斎","寝室","キッチン","屋根裏","温室","地下室"];
function evalL(g,M,Nn){
  var L={g:g,M:M,N:Nn},sp=solve(L,0,true);if(sp.d<0)return -1;
  var need=0,stand=0,i;
  for(i=0;i<N;i++){var ch=g[i];if(ch>="A"&&ch<="C")need|=BIT[ch]}
  for(var bit=1;bit<=4;bit<<=1){if(!(need&bit))continue;var dv=solve(L,bit);if(dv<0||dv>sp.d-4)return -1}
  sp.path.forEach(function(s){var a=(s/N)|0,b=s%N;if(g[a]>="a"&&g[a]<="c")stand|=BIT[g[a]];if(g[b]>="a"&&g[b]<="c")stand|=BIT[g[b]]});
  if((stand&need)!==need)return -1;
  return sp.d;
}
function gen(seed){
  var base=null;
  for(var at=0;at<4000&&!base;at++){
    var r=rng(seed*1009+at*7919+5);
    var ri=function(a,b){return a+Math.floor(r()*(b-a+1))};
    var g=[];for(var i=0;i<N;i++){var x=i%W,y=(i/W)|0;g.push(x===0||y===0||x===W-1||y===H-1?"#":".")}
    var k=ri(2,3),letters=["A","B","C"],doors=[],bad=false,used={h:[],v:[]};
    for(var li=0;li<k;li++){
      var hor=r()<.5,line=hor?ri(3,9):ri(3,6),lst=hor?used.h:used.v;
      if(lst.some(function(z){return Math.abs(z-line)<3})){bad=true;break}
      lst.push(line);var len=hor?W-2:H-2,gp=ri(1,len);
      for(var j=1;j<=len;j++){var idx=hor?line*W+j:j*W+line;if(j!==gp)g[idx]="#"}
      doors.push({hor:hor,line:line,gp:gp,L:letters[li]});
    }
    if(bad)continue;
    var ok=true;
    doors.forEach(function(dd){var idx=dd.hor?dd.line*W+dd.gp:dd.gp*W+dd.line,a2=dd.hor?idx-W:idx-1,b2=dd.hor?idx+W:idx+1;if(g[a2]==="#"||g[b2]==="#")ok=false;g[idx]=dd.L});
    if(!ok)continue;
    var fr=function(){var t,n=0;do{t=ri(1,H-2)*W+ri(1,W-2);n++}while(g[t]!=="."&&n<200);return g[t]==="."?t:-1};
    var fail=false;
    doors.forEach(function(dd){var t=fr();if(t<0){fail=true;return}g[t]=dd.L.toLowerCase()});
    var M=fr();if(M<0||fail)continue;g[M]="M";var Nn=fr();if(Nn<0)continue;g[Nn]="N";
    var em=fr(),en=fr();if(em<0||en<0)continue;g[em]="m";g[en]="n";
    var nf=ri(8,14);for(var f=0;f<nf;f++){var t=fr();if(t>=0){g[t]="#";if(r()<.5){var t2=t+(r()<.5?1:W);if(g[t2]===".")g[t2]="#"}}}
    g[M]=".";g[Nn]=".";
    var d=evalL(g,M,Nn);if(d>=20)base={g:g,M:M,N:Nn,d:d};
  }
  if(!base)return null;
  // 山登り：少しずつ配置を変えて、最短手数が長く(=難しく)なる方向へ
  var r2=rng(seed*31+7),cur=base,curd=base.d;
  for(var it=0;it<500&&curd<150;it++){
    var g2=cur.g.slice(),M2=cur.M,N2=cur.N,op=r2(),x,y,t,tries=0;
    var pickFree=function(){var q;do{q=(1+Math.floor(r2()*(H-2)))*W+1+Math.floor(r2()*(W-2));tries++}while((g2[q]!=="."||q===M2||q===N2)&&tries<100);return g2[q]==="."&&q!==M2&&q!==N2?q:-1};
    if(op<.55){
      var cells=[];for(var i2=0;i2<N;i2++){var c=g2[i2];if("abcmn".indexOf(c)>=0)cells.push(i2)}
      cells.push(-1,-2);var pk=cells[Math.floor(r2()*cells.length)],dest=pickFree();if(dest<0)continue;
      if(pk===-1)M2=dest;else if(pk===-2)N2=dest;else{g2[dest]=g2[pk];g2[pk]="."}
    }else if(op<.8){var q=pickFree();if(q<0)continue;g2[q]="#"}
    else{var wl=[];for(var i3=0;i3<N;i3++){var xx=i3%W,yy=(i3/W)|0;if(g2[i3]==="#"&&xx>0&&yy>0&&xx<W-1&&yy<H-1)wl.push(i3)}if(!wl.length)continue;g2[wl[Math.floor(r2()*wl.length)]]="."}
    var d2=evalL(g2,M2,N2);
    if(d2>=curd){cur={g:g2,M:M2,N:N2,d:d2};curd=d2}
  }
  return {g:cur.g,M:cur.M,N:cur.N,d:curd};
}
if(typeof module!=="undefined")module.exports={gen:gen,solve:solve,W:W,H:H};

</script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var JST=new Date(Date.now()+9*3600*1000);
var dayKey=JST.getUTCFullYear()*10000+(JST.getUTCMonth()+1)*100+JST.getUTCDate();
var dayLabel=(JST.getUTCMonth()+1)+"/"+JST.getUTCDate();
$("date").textContent=JST.getUTCFullYear()+"年"+dayLabel+"の部屋";
var BASE=location.origin==="null"||location.protocol==="file:"?"https://yuchin0809.github.io/games/escape/":(location.origin+location.pathname);
var TS=32,CW=W*TS,CH=H*TS;

/* ===== 部屋の読み込み／書き出し ===== */
function toStr(L){var s="";for(var i=0;i<N;i++){var c=L.g[i];if(i===L.M)c="M";else if(i===L.N)c="N";else if(c==="#")c="w";else if(c===".")c="o";s+=c}return s}
function fromStr(s){
  if(!s||s.length!==N)return null;var g=[],M=-1,Nn=-1,cm=0,cn=0;
  for(var i=0;i<N;i++){var c=s[i],x=i%W,y=(i/W)|0,edge=x===0||y===0||x===W-1||y===H-1;
    if(c==="w")c="#";else if(c==="o")c=".";
    if("#.abcABCmnMN".indexOf(c)<0)return null;
    if(edge)c="#";
    if(c==="M"){M=i;c="."}else if(c==="N"){Nn=i;c="."}
    if(c==="m")cm++;if(c==="n")cn++;g.push(c)}
  if(M<0||Nn<0||cm!==1||cn!==1)return null;
  return {g:g,M:M,N:Nn};
}
function themeOf(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return THEMES[Math.abs(h)%6]}
var daily=gen(dayKey);
var qs=(location.search.match(/[?&]r=([^&]+)/)||[])[1];
var custom=qs?fromStr(qs):null;
if(custom){custom.theme=themeOf(qs);custom.custom=true}
var cur=null; // 現在の部屋

/* ===== 描画 ===== */
var TH={
 "書斎":{f:["#a97c50","#9d7147"],plank:1,w:"#4a3020",wd:"#33200f",deco:"book"},
 "寝室":{f:["#e6cfa5","#dcc296"],plank:1,w:"#8fb0d8",wd:"#6b8cb5",deco:"bed"},
 "キッチン":{f:["#e9e4d8","#d6d0c2"],plank:0,w:"#f4f4f1",wd:"#bdbdb8",deco:"kit"},
 "屋根裏":{f:["#8a6a45","#7d5f3d"],plank:1,w:"#b98a4e",wd:"#85602c",deco:"crate"},
 "温室":{f:["#bcd9a8","#aecb9b"],plank:0,w:"#c9703f",wd:"#8f4a24",deco:"pot"},
 "地下室":{f:["#7b7f8a","#6f7380"],plank:0,w:"#575b66",wd:"#3d4049",deco:"stone"}
};
var COL={a:"#ff5d5d",b:"#4aa3ff",c:"#ffd23f"};
function hsh(x,y){var h=(x*374761393+y*668265263)^(x*y*1274126177);h=(h^(h>>>13))*1103515245;return((h^(h>>>16))>>>0)/4294967296}
function drawChar(c,x,y,s,kind,dir,anim,moving,active){
  var mimi=kind===1;
  c.save();c.translate(x,y);c.scale(s,s);
  if(active){c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=2;c.beginPath();c.ellipse(0,11,15,6,0,0,7);c.stroke()}
  var bob=moving?Math.sin(anim*14)*1.5:Math.sin(anim*3)*.5;
  c.fillStyle="rgba(0,0,0,.3)";c.beginPath();c.ellipse(0,11,11,4.5,0,0,7);c.fill();
  c.fillStyle=mimi?"#e0719f":"#3aa88a";c.beginPath();c.ellipse(-5,10,4,3,0,0,7);c.ellipse(5,10,4,3,0,0,7);c.fill();
  c.translate(0,bob);
  c.fillStyle=mimi?"#ffb3d1":"#7fe3c4";c.beginPath();c.arc(0,0,12,0,7);c.fill();
  c.fillStyle=mimi?"#ffe0ee":"#b5f3dd";c.beginPath();c.ellipse(0,4,8,6,0,0,7);c.fill();
  if(mimi){c.fillStyle="#ff4f93";c.beginPath();c.moveTo(0,-11);c.lineTo(-9,-17);c.lineTo(-9,-7);c.closePath();c.moveTo(0,-11);c.lineTo(9,-17);c.lineTo(9,-7);c.closePath();c.fill();c.beginPath();c.arc(0,-11,2.6,0,7);c.fill()}
  else{c.fillStyle="#ff6b6b";c.fillRect(-10,4,20,3.5);c.strokeStyle="#3aa88a";c.lineWidth=2;c.beginPath();c.moveTo(0,-11);c.quadraticCurveTo(0,-17,4,-18);c.stroke();c.fillStyle="#5fd35a";c.beginPath();c.ellipse(6,-18,5,2.6,-.5,0,7);c.fill()}
  var ox=dir*2.4;
  c.fillStyle="#fff";c.beginPath();c.arc(-4.5+ox,-3,3.6,0,7);c.arc(4.5+ox,-3,3.6,0,7);c.fill();
  c.fillStyle="#222";c.beginPath();c.arc(-4.5+ox*1.6,-3,1.7,0,7);c.arc(4.5+ox*1.6,-3,1.7,0,7);c.fill();
  c.fillStyle=mimi?"#ff7aa8":"#ff9aa8";c.beginPath();c.arc(-8,1.6,1.8,0,7);c.arc(8,1.6,1.8,0,7);c.fill();
  c.restore();
}
function floorTile(c,x,y,th){
  var X=x*TS,Y=y*TS,t=TH[th],v=hsh(x,y);
  c.fillStyle=t.f[(x+y)%2];c.fillRect(X,Y,TS,TS);
  if(t.plank){c.fillStyle="rgba(0,0,0,.12)";c.fillRect(X,Y+TS-2,TS,2);c.fillRect(X+((v*TS)|0),Y,1.5,TS-2);c.fillStyle="rgba(255,255,255,.06)";c.fillRect(X,Y,TS,2)}
  else{c.strokeStyle="rgba(0,0,0,.12)";c.lineWidth=1;c.strokeRect(X+.5,Y+.5,TS-1,TS-1);if(v<.18){c.fillStyle="rgba(0,0,0,.06)";c.fillRect(X+4,Y+4,10,8)}}
}
function wallTile(c,x,y,th,edge,g){
  var X=x*TS,Y=y*TS,t=TH[th],v=hsh(x,y);
  c.fillStyle=t.wd;c.fillRect(X,Y,TS,TS);
  c.fillStyle=t.w;c.fillRect(X,Y,TS,TS-4);
  c.fillStyle="rgba(255,255,255,.14)";c.fillRect(X,Y,TS,2);
  if(edge){c.fillStyle="rgba(0,0,0,.18)";c.fillRect(X,Y,TS,TS);return}
  var d=t.deco;
  if(d==="book"){var cols=["#c0392b","#2e86c1","#27ae60","#e6a23c","#8e44ad","#d35400"];for(var k=0;k<5;k++){c.fillStyle=cols[((v*10|0)+k*2)%6];c.fillRect(X+3+k*5.6,Y+4,4.4,TS-12)}c.fillStyle="rgba(0,0,0,.25)";c.fillRect(X,Y+TS-8,TS,2)}
  else if(d==="bed"){c.fillStyle="#fff";c.fillRect(X+3,Y+3,TS-6,11);c.fillStyle="#dbe7f7";c.fillRect(X+3,Y+14,TS-6,TS-20);c.fillStyle="rgba(0,0,0,.1)";c.fillRect(X+3,Y+13,TS-6,1.5)}
  else if(d==="kit"){c.fillStyle="#cfd2d6";c.fillRect(X+3,Y+3,TS-6,TS-10);if(v<.5){c.fillStyle="#555";c.beginPath();c.arc(X+11,Y+12,4,0,7);c.arc(X+22,Y+12,4,0,7);c.fill();c.fillStyle="#222";c.beginPath();c.arc(X+11,Y+12,1.6,0,7);c.arc(X+22,Y+12,1.6,0,7);c.fill()}else{c.fillStyle="#9fb7c9";c.fillRect(X+7,Y+8,TS-14,11);c.fillStyle="#7e97a8";c.fillRect(X+15,Y+5,2,4)}}
  else if(d==="crate"){c.strokeStyle="#6a4719";c.lineWidth=2;c.strokeRect(X+3,Y+3,TS-6,TS-10);c.beginPath();c.moveTo(X+3,Y+3);c.lineTo(X+TS-3,Y+TS-7);c.moveTo(X+TS-3,Y+3);c.lineTo(X+3,Y+TS-7);c.stroke()}
  else if(d==="pot"){c.fillStyle="#c25b2b";c.beginPath();c.moveTo(X+8,Y+17);c.lineTo(X+TS-8,Y+17);c.lineTo(X+TS-11,Y+TS-5);c.lineTo(X+11,Y+TS-5);c.fill();c.fillStyle="#3f9a4a";[[16,10,8],[10,13,6],[22,13,6]].forEach(function(l){c.beginPath();c.arc(X+l[0],Y+l[1],l[2],0,7);c.fill()});c.fillStyle="#5fc46a";c.beginPath();c.arc(X+15,Y+8,4,0,7);c.fill()}
  else{c.strokeStyle="rgba(0,0,0,.25)";c.lineWidth=1.5;c.strokeRect(X+1,Y+1,TS-2,TS-6);c.beginPath();c.moveTo(X,Y+14);c.lineTo(X+TS,Y+14);c.moveTo(X+(v<.5?10:22),Y);c.lineTo(X+(v<.5?10:22),Y+14);c.moveTo(X+(v<.5?22:10),Y+14);c.lineTo(X+(v<.5?22:10),Y+TS-4);c.stroke()}
}
function drawLevel(c,L,st,edit){
  var th=L.theme;
  for(var y=0;y<H;y++)for(var x=0;x<W;x++)floorTile(c,x,y,th);
  // 壁の影
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){var i=y*W+x;if(L.g[i]==="#"){var b=i+W;if(y<H-1&&L.g[b]!=="#"){var gr=c.createLinearGradient(0,y*TS+TS,0,y*TS+TS+10);gr.addColorStop(0,"rgba(0,0,0,.35)");gr.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=gr;c.fillRect(x*TS,y*TS+TS,TS,10)}}}
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){var i=y*W+x,ch=L.g[i];
    var X=x*TS,Y=y*TS,cx=X+TS/2,cy=Y+TS/2;
    if(ch==="#")wallTile(c,x,y,th,x===0||y===0||x===W-1||y===H-1);
    else if(ch>="a"&&ch<="c"){var on=st&&(st.tm===i||st.tn===i);
      c.fillStyle="rgba(0,0,0,.3)";c.beginPath();c.arc(cx,cy+2,12,0,7);c.fill();
      c.fillStyle=COL[ch];c.beginPath();c.arc(cx,cy+(on?2:0),11,0,7);c.fill();
      c.fillStyle="rgba(255,255,255,"+(on?.15:.45)+")";c.beginPath();c.arc(cx-2,cy-2+(on?2:0),6,0,7);c.fill();
      c.strokeStyle="rgba(0,0,0,.35)";c.lineWidth=2;c.beginPath();c.arc(cx,cy+(on?2:0),11,0,7);c.stroke()}
    else if(ch==="m"||ch==="n"){var pk=ch==="n",col=pk?"#ff7ab0":"#4ed3a5";
      c.fillStyle=col;c.globalAlpha=.35;c.beginPath();c.arc(cx,cy,15,0,7);c.fill();c.globalAlpha=1;
      c.strokeStyle=col;c.lineWidth=3;c.setLineDash([5,4]);c.beginPath();c.arc(cx,cy,12,0,7);c.stroke();c.setLineDash([]);
      c.fillStyle=col;c.beginPath();c.moveTo(cx-3,cy+7);c.lineTo(cx-3,cy-9);c.lineTo(cx+8,cy-5);c.lineTo(cx-3,cy-1);c.closePath();c.fill();c.fillRect(cx-4,cy-9,2,16)}
  }
  // とびら
  for(var i=0;i<N;i++){var ch=L.g[i];if(ch>="A"&&ch<="C"){var x=i%W,y=(i/W)|0,X=x*TS,Y=y*TS,col=COL[ch.toLowerCase()],open=st?st.open[i]:false;
    if(open){c.strokeStyle=col;c.globalAlpha=.6;c.lineWidth=2;c.setLineDash([4,4]);c.strokeRect(X+3,Y+3,TS-6,TS-6);c.setLineDash([]);c.globalAlpha=1}
    else{c.fillStyle="rgba(0,0,0,.35)";c.fillRect(X,Y+3,TS,TS);c.fillStyle="#3a3340";c.fillRect(X,Y,TS,TS);c.fillStyle=col;c.fillRect(X,Y,TS,5);c.fillRect(X,Y+TS-5,TS,5);
      c.fillStyle="#6b6275";for(var k=0;k<4;k++)c.fillRect(X+4+k*7.4,Y+5,3.6,TS-10);
      c.fillStyle=col;c.beginPath();c.arc(X+TS/2,Y+TS/2,5,0,7);c.fill();c.fillStyle="#222";c.fillRect(X+TS/2-1,Y+TS/2-1,2,5)}}}
}

/* ===== ゲーム状態 ===== */
var st=null,timerId=null,last=0,vec={x:0,y:0},keys={},raf=0,finished=false;
function idxOf(px,py){return Math.floor(py/TS)*W+Math.floor(px/TS)}
function center(i){return {x:(i%W)*TS+TS/2,y:((i/W)|0)*TS+TS/2}}
function newState(L){
  var a=center(L.M),b=center(L.N);
  return {L:L,t0:Date.now(),tw:[{x:a.x,y:a.y,dir:1,anim:0,mv:false},{x:b.x,y:b.y,dir:1,anim:0,mv:false}],act:0,open:{},tm:L.M,tn:L.N,win:0};
}
function recompute(){
  var s=st,L=s.L;s.tm=idxOf(s.tw[0].x,s.tw[0].y);s.tn=idxOf(s.tw[1].x,s.tw[1].y);
  var bits=0;[s.tm,s.tn].forEach(function(i){var ch=L.g[i];if(ch>="a"&&ch<="c")bits|=BIT[ch]});
  s.open={};
  for(var i=0;i<N;i++){var ch=L.g[i];if(ch>="A"&&ch<="C"){var o=!!(bits&BIT[ch]);
    if(!o){var X=(i%W)*TS,Y=((i/W)|0)*TS;s.tw.forEach(function(t){if(t.x+9>X&&t.x-9<X+TS&&t.y+9>Y&&t.y-9<Y+TS)o=true})}
    s.open[i]=o}}
}
function solid(i){var ch=st.L.g[i];return ch==="#"||(ch>="A"&&ch<="C"&&!st.open[i])}
function blocked(nx,ny,r){
  var x0=Math.floor((nx-r)/TS),x1=Math.floor((nx+r)/TS),y0=Math.floor((ny-r)/TS),y1=Math.floor((ny+r)/TS);
  for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){
    if(x<0||y<0||x>=W||y>=H)return true;
    if(solid(y*W+x)){var cx=Math.max(x*TS,Math.min(nx,x*TS+TS)),cy=Math.max(y*TS,Math.min(ny,y*TS+TS));if((nx-cx)*(nx-cx)+(ny-cy)*(ny-cy)<r*r)return true}
  }
  return false;
}
function step(dt){
  var s=st,t=s.tw[s.act],vx=vec.x,vy=vec.y;
  if(keys.ArrowLeft||keys.a)vx-=1;if(keys.ArrowRight||keys.d)vx+=1;if(keys.ArrowUp||keys.w)vy-=1;if(keys.ArrowDown||keys.s)vy+=1;
  var m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m}
  t.mv=m>.12;s.tw[1-s.act].mv=false;
  if(t.mv){var sp=96*dt,nx=t.x+vx*sp,ny=t.y+vy*sp,r=9.5;if(!blocked(nx,t.y,r))t.x=nx;if(!blocked(t.x,ny,r))t.y=ny;if(Math.abs(vx)>.2)t.dir=vx>0?1:-1;t.anim+=dt}
  s.tw.forEach(function(q){if(!q.mv)q.anim+=dt*.4});
  recompute();
  if(!finished&&s.L.g[s.tm]==="m"&&s.L.g[s.tn]==="n"){finished=true;setTimeout(function(){finish(true)},500)}
}
function render(){
  var s=st;if(!s)return;var c=cv.getContext("2d"),sc=cv.width/CW;c.setTransform(sc,0,0,sc,0,0);
  drawLevel(c,s.L,s,false);
  var ord=[0,1].sort(function(a,b){return s.tw[a].y-s.tw[b].y});
  ord.forEach(function(i){var t=s.tw[i];drawChar(c,t.x,t.y,.82,i,t.dir,t.anim,t.mv,i===s.act&&!finished)});
}
function loop(t){var dt=Math.min(.05,(t-last)/1000||0);last=t;if(st&&!$("game").classList.contains("hide")){if(!finished)step(dt);render()}raf=requestAnimationFrame(loop)}

/* ===== 画面 ===== */
var cv=$("cv"),ec=$("ec"),dpr=Math.min(window.devicePixelRatio||1,2);
function sizeCanvas(k,reserve){var avail=window.innerHeight-reserve;var h=Math.min(avail,window.innerWidth*1.3-6,580);h=Math.max(h,240);var w=h*CW/CH;k.style.width=w+"px";k.style.height=h+"px";k.width=Math.round(w*dpr);k.height=Math.round(h*dpr)}
function resize(){sizeCanvas(cv,60+150);sizeCanvas(ec,60+210);if(!$("edit").classList.contains("hide"))drawEdit()}
window.addEventListener("resize",resize);
function show(id){["start","game","edit","result"].forEach(function(k){$(k).classList.toggle("hide",k!==id)});resize()}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)}
function elapsed(){return (Date.now()-st.t0)/1000}
function tick(){if(!st||finished)return;var l=240-elapsed();$("timer").textContent=fmt(l);$("timer").className=l<30?"low":"";if(l<=0)finish(false)}
function setWho(){var m=st.act===1;$("who").textContent="操作中："+(m?"ミミ":"ミル");$("who").style.color=m?"#ff9ec7":"#7fe3c4";$("swap").className=m?"":"mimi";$("swap").textContent="いれかえ\n→"+(m?"ミル":"ミミ")}
function bestKey(L){return "esc3_best_"+(L.custom?"c"+(qs||"").slice(0,24):dayKey)}
function getBest(k){try{return localStorage.getItem(k)}catch(e){return null}}
function setBest(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function startLevel(L){
  cur=L;st=newState(L);finished=false;vec.x=vec.y=0;recompute();show("game");setWho();tick();
  clearInterval(timerId);timerId=setInterval(tick,250);
}
var shareText="";
function finish(ok){
  clearInterval(timerId);var sec=Math.min(240,Math.round(elapsed())),tm=fmt(sec);st=null;vec.x=vec.y=0;
  var url=cur.custom?BASE+"?r="+qs:BASE;
  show("result");
  if(ok){$("rtitle").textContent="🔓 ふたりで脱出！ "+tm;
    var k=bestKey(cur),pv=getBest(k);if(!pv||sec<Number(pv))setBest(k,sec);
    shareText=(cur.custom?"友達がつくった部屋":"ふたごミルの脱出部屋 "+dayLabel)+"\n🔓 ミルとミミが"+tm+"で脱出！\n"+url+"\n#ふたごミル"}
  else{$("rtitle").textContent="⏰ 時間切れ…";
    shareText=(cur.custom?"友達がつくった部屋":"ふたごミルの脱出部屋 "+dayLabel)+"\n⏰ ふたりは脱出できなかった…\n"+url+"\n#ふたごミル"}
  $("share").textContent=shareText;
}

/* ===== 入力 ===== */
var stick=$("stick"),knob=$("knob"),sid=null;
function sMove(e){var r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),mx=r.width/2-8;if(m>mx){dx=dx/m*mx;dy=dy/m*mx}knob.style.left=(35+dx)+"px";knob.style.top=(35+dy)+"px";vec.x=dx/mx;vec.y=dy/mx}
stick.addEventListener("pointerdown",function(e){sid=e.pointerId;stick.setPointerCapture(sid);sMove(e);e.preventDefault()});
stick.addEventListener("pointermove",function(e){if(e.pointerId===sid)sMove(e)});
function sEnd(e){if(e.pointerId!==sid)return;sid=null;knob.style.left="35px";knob.style.top="35px";vec.x=vec.y=0}
stick.addEventListener("pointerup",sEnd);stick.addEventListener("pointercancel",sEnd);
function swap(){if(!st||finished)return;st.act=1-st.act;setWho()}
$("swap").addEventListener("pointerdown",function(e){e.preventDefault();swap()});
$("rst").onclick=function(){if(!st)return;var t0=st.t0;st=newState(cur);st.t0=t0;finished=false;recompute();setWho()};
window.addEventListener("keydown",function(e){var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k===" "||k==="Tab"){if(st){swap();e.preventDefault()}return}
  if(k==="r"&&st){$("rst").onclick();return}
  keys[k]=true;if(k.indexOf("Arrow")===0)e.preventDefault()});
window.addEventListener("keyup",function(e){var k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});

/* ===== 部屋づくり ===== */
var E=null,sel="#",PAL=[["#","かべ","#6b5b8a"],[".","ゆか","#d8c29a"],["M","ミル\nスタート","#4ed3a5"],["N","ミミ\nスタート","#ff7ab0"],["m","ミル\nゴール","#4ed3a5"],["n","ミミ\nゴール","#ff7ab0"],["a","ボタン赤","#ff5d5d"],["b","ボタン青","#4aa3ff"],["c","ボタン黄","#ffd23f"],["A","とびら赤","#ff5d5d"],["B","とびら青","#4aa3ff"],["C","とびら黄","#ffd23f"]];
function buildPal(){
  var p=$("pal");p.innerHTML="";
  PAL.forEach(function(x){var b=document.createElement("button");b.innerHTML='<i style="background:'+x[2]+'"></i>'+x[1].replace("\n","<br>");b.className=x[0]===sel?"on":"";b.onclick=function(){sel=x[0];buildPal()};p.appendChild(b)});
}
function eToLevel(){var L=fromStr(E.join(""));if(L){L.theme=cur&&cur.theme||"書斎"}return L}
function drawEdit(){
  if(!E)return;var c=ec.getContext("2d"),sc=ec.width/CW;c.setTransform(sc,0,0,sc,0,0);
  var g=[];for(var i=0;i<N;i++){var ch=E[i];g.push(ch==="M"||ch==="N"?".":ch)}
  var M=E.indexOf("M"),Nn=E.indexOf("N");
  var L={g:g,M:M,N:Nn,theme:cur&&cur.theme||"書斎"};
  drawLevel(c,L,{open:{},tm:-1,tn:-1},true);
  if(M>=0){var a=center(M);drawChar(c,a.x,a.y,.82,0,1,0,false,false)}
  if(Nn>=0){var b=center(Nn);drawChar(c,b.x,b.y,.82,1,1,0,false,false)}
  c.strokeStyle="rgba(255,255,255,.07)";c.lineWidth=1;for(var x=1;x<W;x++){c.beginPath();c.moveTo(x*TS,0);c.lineTo(x*TS,CH);c.stroke()}for(var y=1;y<H;y++){c.beginPath();c.moveTo(0,y*TS);c.lineTo(CW,y*TS);c.stroke()}
}
function place(e){
  var r=ec.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);
  if(x<1||y<1||x>W-2||y>H-2)return;var i=y*W+x;
  if("MNmn".indexOf(sel)>=0){var o=E.indexOf(sel);if(o>=0)E[o]=".";}
  var cur0=E[i];if((cur0==="M"||cur0==="N"||cur0==="m"||cur0==="n")&&sel==="#")return;
  E[i]=sel;$("eshare").classList.add("hide");$("emsg").textContent="";drawEdit();
}
var drawing=false;
ec.addEventListener("pointerdown",function(e){drawing=true;ec.setPointerCapture(e.pointerId);place(e)});
ec.addEventListener("pointermove",function(e){if(drawing&&(sel==="#"||sel==="."))place(e)});
ec.addEventListener("pointerup",function(){drawing=false});
function openEdit(){
  if(!E){var base=daily||{g:[],M:0,N:0};var s=base.g?toStr(base):"";E=s?s.split(""):[]}
  buildPal();show("edit");drawEdit();
}
$("mk").onclick=openEdit;$("mk2").onclick=openEdit;
$("eback").onclick=function(){show("start")};
$("eclear").onclick=function(){var a=[];for(var i=0;i<N;i++){var x=i%W,y=(i/W)|0;a.push(x===0||y===0||x===W-1||y===H-1?"w":"o")}a[1*W+1]="M";a[1*W+2]="N";a[2*W+1]="m";a[2*W+2]="n";E=a;$("eshare").classList.add("hide");$("emsg").textContent="";drawEdit()};
var eurl="";
$("echeck").onclick=function(){
  var L=eToLevel(),m=$("emsg");
  if(!L){m.style.color="var(--ng)";m.textContent="ミル・ミミのスタートと、ふたりのゴールを1つずつ置いてね。";return}
  var d=solve(L,0);
  if(d<0){m.style.color="var(--ng)";m.textContent="この部屋はクリアできません。ボタンととびらの置き方を見直してね。";$("eshare").classList.add("hide");return}
  m.style.color="var(--ok)";m.textContent="✅ クリアできる部屋です！（最短 "+d+" 手）";
  eurl=BASE+"?r="+toStr(L);$("eurl").textContent=eurl;$("eshare").classList.remove("hide");
};
$("etweet").onclick=function(){window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent("ふたごミルの脱出部屋で、私がつくった部屋にチャレンジ！\n"+eurl+"\n#ふたごミル"),"_blank")};
$("ecopy").onclick=function(){var d=function(){$("ecopy").textContent="コピーしました"};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(eurl).then(d,function(){});else d()};
$("eplay").onclick=function(){var L=eToLevel();if(!L)return;L.theme=themeOf(toStr(L));L.custom=false;startLevel(L)};

/* ===== 起動 ===== */
if(!daily)daily=gen(dayKey+1);
daily.theme=THEMES[dayKey%6];daily.custom=false;
var target=custom||daily;
$("rname").textContent=custom?"友達がつくった部屋に挑戦！":"今日の部屋：「"+daily.theme+"」";
if(custom)$("go").textContent="友達の部屋であそぶ";
var b0=getBest(bestKey(target));if(b0)$("best").textContent="この部屋のベスト："+fmt(Number(b0));
$("go").onclick=function(){startLevel(target)};
$("again").onclick=function(){startLevel(cur)};
$("tweet").onclick=function(){window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(shareText),"_blank")};
$("copy").onclick=function(){var d=function(){$("copy").textContent="コピーしました"};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(shareText).then(d,function(){});else d()};
(function(){var c=$("tw").getContext("2d");drawChar(c,80,48,2.4,0,1,0,false,false);drawChar(c,180,48,2.4,1,-1,0,false,false)})();
resize();raf=requestAnimationFrame(loop);
window.__g={get st(){return st},solve:solve,target:target,daily:daily,swap:swap,get cur(){return cur},finish:finish};
})();
</script>
