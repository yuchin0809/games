<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゆうのゲームひろば｜ブラウザで遊べる無料ミニゲーム</title>
<meta name="description" content="インストール不要・登録不要。ブラウザですぐ遊べる、ひとつのアイデアだけで作った無料ミニゲームを置いています。">
<style>
  :root{--bg:#fff7ec;--ink:#3b2a20;--sub:#7a6556;--card:#fff;--line:#ecd9c3;--ok:#2ea36b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.7}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:1.6rem;text-align:center}
  .lead{text-align:center;color:var(--sub);font-size:.92rem;margin-top:4px}
  h2{font-size:1.1rem;margin:26px 0 8px}
  .game{
    display:block;text-decoration:none;color:inherit;
    background:var(--card);border:2px solid var(--line);border-radius:18px;
    padding:16px;margin-top:12px;
  }
  .game:active{transform:translateY(2px)}
  .game b{font-size:1.15rem}
  .game p{font-size:.9rem;color:var(--sub);margin-top:4px}
  .tag{display:inline-block;font-size:.72rem;background:var(--ok);color:#fff;border-radius:999px;padding:1px 10px;margin-left:6px;vertical-align:middle}
  .about p{font-size:.92rem;color:var(--sub)}
  footer{text-align:center;font-size:.78rem;color:var(--sub);margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ゆうのゲームひろば</h1>
  <p class="lead">ブラウザですぐ遊べる、無料のミニゲーム集</p>

  <h2>ゲーム一覧</h2>
  <a class="game" href="mono/">
    <b>モノに生まれたら</b><span class="tag">試作</span>
    <p>1円玉かもしれないし、ペットボトルかもしれない。統計データにもとづいて、身の回りのモノとして生まれ、その一生を見届けよう。</p>
  </a>

  <h2>このサイトについて</h2>
  <div class="about">
    <p>「ゆう」が、ひとつのアイデアだけで作った小さなゲームを置いているサイトです。インストールも登録もいりません。スマホでもパソコンでも、開くだけで遊べます。新しいゲームは少しずつ増やしていきます。</p>
  </div>

  <footer>© ゆうのゲームひろば</footer>
</div>
</body>
</html>
